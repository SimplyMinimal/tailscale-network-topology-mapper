---
services:
  tailscale_visualizer:
    container_name: tailscale_visualizer
    ports:
      - 8080:8080
    build:
      context: ./
    volumes:
      - ./policy.hujson:/app/tailscale-network-topology-mapper/policy.hujson:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
